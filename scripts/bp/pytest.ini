[pytest]
minversion = 8.0
testpaths = tests
pythonpath = src
empty_parameter_set_mark = fail_at_collect
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-config
    --strict-markers
markers =
    unit: fast isolated tests
    integration: tests that cross process, service, database, filesystem, or network boundaries
    slow: tests that are intentionally slower than normal unit tests
    smoke: small high-value checks for basic system health
